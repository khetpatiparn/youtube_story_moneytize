[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-story-automation"
version = "0.1.0"
description = "POC for a recoverable YouTube story automation workflow."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1,<2",
    "langgraph>=0.2",
    "Pillow>=10,<13",
    "pydantic>=2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["apps/orchestrator/src"]
